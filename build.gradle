plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.+'
}


base {
    archivesName = project.archives_base_name
}
version = project.mod_version
minecraft_version = project.minecraft_version
group = project.maven_group

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/jeffmod.accesswidener")
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation "meteordevelopment:meteor-client:${project.meteor_version}"
    // Fabric API resource loader (compile only - the merged game jar has MinecraftServer implement DataResourceStore)
    compileOnly "net.fabricmc.fabric-api:fabric-resource-loader-v1:2.0.13+9edec1269e"
    // XaeroPlus
    implementation "maven.modrinth:xaeroplus:${project.xaeroplus_version}"
    // XaeroWorldMap
    implementation "maven.modrinth:xaeros-world-map:${project.xaeros_worldmap_version}"
    // XaeroMinimap
    implementation "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}"
    // lenni
    implementation "net.lenni0451:LambdaEvents:2.4.2"
    implementation "com.github.ben-manes.caffeine:caffeine:3.1.8"

    compileOnly "meteordevelopment:baritone:${project.baritone_version}"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
            "mc_version": project.property("minecraft_version"),
            "xp_version": project.property("xaeroplus_version"),
            "xwm_version": project.property("xaeros_worldmap_version"),
            "xmm_version": project.property("xaeros_minimap_version")
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
}
